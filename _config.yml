title: Victor's Notes
author: Victor Yao
description: Share some useful guides here for helping others.
theme: just-the-docs

url: https://victor-yao.github.io
baseurl: ""
permalink: pretty

# Exclude non-content directories from Jekyll build
exclude:
  - Templates/
  - .obsidian/

aux_links:
  Repository on GitHub: https://github.com/Victor-Yao/victor-yao.github.io
aux_links_new_tab: true

# Search
search_enabled: true

# Color scheme (light/dark toggle button)
color_scheme: light

# Enable callouts for tips/warnings/notes
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# "Edit this page on GitHub" links
gh_edit_repository: "https://github.com/Victor-Yao/victor-yao.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"
gh_edit_link_text: "Edit this page on GitHub"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

defaults:
  - scope:
      path: "docs" # an empty string here means all files in the project
      type: "pages"
    values:
      layout: "default"

# Footer last edited timestamp
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"  # 可按需改格式
