title: Victor Yao's Tech Notes
author: Victor Yao
description: Practical troubleshooting guides, technical deep dives, and lessons learned from real-world debugging.
theme: just-the-docs
lang: en-US
timezone: Asia/Shanghai
repository: Victor-Yao/victor-yao.github.io
github_username: Victor-Yao

social:
  name: Victor Yao
  links:
    - https://github.com/Victor-Yao

plugins:
  - jekyll-feed
  - jekyll-sitemap

url: https://victor-yao.github.io
baseurl: ""
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

feed:
  path: feed.xml

# Exclude non-content directories from Jekyll build
exclude:
  - Templates/
  - .obsidian/

aux_links:
  Repository on GitHub: https://github.com/Victor-Yao/victor-yao.github.io
  RSS Feed: https://victor-yao.github.io/feed.xml
aux_links_new_tab: true

# Search
search_enabled: true

# Initial color scheme; actual scheme follows the OS preference
# at runtime via _includes/nav_footer_custom.html
color_scheme: light

# Enable callouts for tips/warnings/notes
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# "Edit this page on GitHub" links
gh_edit_repository: "https://github.com/Victor-Yao/victor-yao.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"
gh_edit_link_text: "Edit this page on GitHub"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "docs" # an empty string here means all files in the project
      type: "pages"
    values:
      content_type: guide
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
      parent: Blog
      nav_exclude: true
      content_type: article

# Footer last edited timestamp
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"  # 可按需改格式
